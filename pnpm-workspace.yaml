# pnpm settings (pnpm 12 reads settings from this file, not package.json)

# Allowlisted dependency build scripts (pnpm blocks unapproved builds by default).
# better-sqlite3 needs its native build; the rest ship prebuilt binaries.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true

minimumReleaseAgeExclude:
  - '@next/env@16.4.3'
  - '@next/mdx@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - next@16.4.3

catalog:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

overrides:
  '@opentelemetry/core@<2.8.0': ^2.8.0
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
  ajv@<6.14.0: ^6.14.0
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  basic-ftp@<5.2.0: ^5.2.1
  browserslist@<=4.28.6: ^4.28.7
  esbuild@<=0.24.2: ^0.25.0
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  picomatch@>=4.0.0 <4.0.4: ^4.0.4
  postcss-selector-parser@<7.1.6: ^7.1.6
  protobufjs@>=8.0.0 <8.0.1: ^8.0.1
  rollup@>=4.0.0 <4.59.0: ^4.59.0
  serialize-javascript@<7.1.3: ^7.1.3
  shell-quote@>=1.1.0 <=1.8.3: ^1.8.4
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  tar@<=7.5.18: ^7.5.19
